[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "gqmrmed-bot"
version = "0.1.0"
description = "Independent Telegram medical infographic generation system."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aiogram>=3.22,<4",
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "sqlalchemy[asyncio]>=2.0,<3",
  "asyncpg>=0.30,<1",
  "alembic>=1.16,<2",
  "redis>=6,<7",
  "pydantic-settings>=2.10,<3",
  "httpx>=0.28,<1",
  "structlog>=25,<26",
  "cairosvg>=2.7,<3",
  "pypdf>=6,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
  "mypy>=1.17,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/gqmrmed"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["gqmrmed"]
known-third-party = ["alembic"]
order-by-type = false

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = ["cairosvg"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pypdf"]
ignore_missing_imports = true
