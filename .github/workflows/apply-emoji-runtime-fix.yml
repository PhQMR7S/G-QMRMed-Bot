name: apply-premium-emoji-runtime-fix

on:
  push:
    branches:
      - feat/emoji-catalog-metadata

permissions:
  contents: write

jobs:
  patch:
    if: github.actor == 'PhQMR7S'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply runtime fix
        run: python scripts/apply_premium_emoji_runtime_fix.py
      - name: Remove temporary patcher
        run: rm -f scripts/apply_premium_emoji_runtime_fix.py .github/workflows/apply-emoji-runtime-fix.yml
      - name: Commit runtime fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/gqmrmed/bot/professional_ui.py
          git add -u scripts/apply_premium_emoji_runtime_fix.py .github/workflows/apply-emoji-runtime-fix.yml
          git diff --cached --quiet || git commit -m "fix(emoji): render Telegram custom emoji with valid alt"
          git push
