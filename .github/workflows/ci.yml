name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      - name: Compile Python sources
        run: python -m compileall -q src alembic

      - name: Validate Alembic migrations
        run: alembic upgrade head --sql > /tmp/gqmrmed-schema.sql

      - name: Ruff
        run: ruff check .

      - name: MyPy
        run: mypy src

      - name: Pytest
        run: pytest
