name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      - name: Compile Python sources
        run: python -m compileall -q src alembic

      - name: Validate Alembic migrations
        run: alembic upgrade head --sql > /tmp/gqmrmed-schema.sql

      - name: Ruff
        run: ruff check .

      - name: MyPy
        run: mypy src

      - name: Verify source package resolution
        run: PYTHONPATH=src python -c "import gqmrmed.contracts.generation as m; assert m.__file__.startswith('src/'), m.__file__"

      - name: Pytest
        run: PYTHONPATH=src pytest
