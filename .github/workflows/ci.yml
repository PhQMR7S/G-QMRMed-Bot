name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Compile Python sources
        run: python -m compileall -q src alembic

      - name: Validate Alembic migrations
        run: alembic upgrade head --sql > /tmp/gqmrmed-schema.sql

      - name: Ruff
        run: ruff check .

      - name: MyPy
        run: mypy src

      - name: Verify source package resolution
        run: python -c "from pathlib import Path; import gqmrmed.contracts.generation as m; source = Path('src/gqmrmed').resolve(); loaded = Path(m.__file__).resolve(); assert loaded.is_relative_to(source), f'Unexpected package path: {loaded}'"

      - name: Diagnostic - phase5 rendering
        run: python -m pytest -q tests/test_phase5_rendering.py

      - name: Diagnostic - infographic engine
        run: python -m pytest -q tests/test_infographic_engine.py

      - name: Diagnostic - production pipeline
        run: python -m pytest -q tests/test_production_pipeline.py

      - name: Diagnostic - phase4 medical pipeline
        run: python -m pytest -q tests/test_phase4_medical_pipeline.py

      - name: Diagnostic - phase5 image generation
        run: python -m pytest -q tests/test_phase5_image_generation.py

      - name: Diagnostic - design preferences
        run: python -m pytest -q tests/test_design_preferences.py

      - name: Diagnostic - phase9 multi-provider pipeline
        run: python -m pytest -q tests/test_phase9_multi_provider_pipeline.py

      - name: Pytest
        run: python -m pytest

      - name: Validate production release gate
        env:
          APP_ENV: production
          DATABASE_URL: postgresql+asyncpg://gqmrmed:gqmrmed@db:5432/gqmrmed
          REDIS_URL: redis://redis:6379/0
          TELEGRAM_BOT_TOKEN: ci-token
          ADMIN_SECRET: ci-admin-secret-012345678901234567890123456789
          COMFYUI_BASE_URL: http://comfyui:8188
          COMFYUI_WORKFLOW_JSON: '{"ci":{"class_type":"CheckpointLoaderSimple","inputs":{}}}'
          AI_PROVIDER_ORDER: ollama
          OLLAMA_BASE_URL: http://ollama:11434
        run: bash scripts/release-gate.sh

      - name: Validate production Compose contract
        run: |
          export DATABASE_URL='postgresql+asyncpg://gqmrmed:gqmrmed@db:5432/gqmrmed'
          export REDIS_URL='redis://redis:6379/0'
          export TELEGRAM_BOT_TOKEN='ci-token'
          export ADMIN_SECRET='ci-admin-secret-012345678901234567890123456789'
          export COMFYUI_BASE_URL='http://comfyui:8188'
          export COMFYUI_WORKFLOW_JSON='{}'
          docker compose -f compose.production.yml config --quiet

      - name: Build production container
        run: docker build --tag gqmrmed:ci .

      - name: Smoke-test production container imports
        run: |
          docker run --rm --entrypoint python gqmrmed:ci -c "import gqmrmed.main; import gqmrmed.services.runtime"
