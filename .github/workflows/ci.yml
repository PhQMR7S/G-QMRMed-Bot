name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Compile Python sources
        run: python -m compileall -q src alembic

      - name: Validate Alembic migrations
        run: alembic upgrade head --sql > /tmp/gqmrmed-schema.sql

      - name: Ruff
        run: ruff check .

      - name: MyPy
        run: mypy src

      - name: Verify source package resolution
        run: >-
          python -c "from pathlib import Path; import gqmrmed.contracts.generation as m; source = Path('src/gqmrmed').resolve(); loaded = Path(m.__file__).resolve(); assert loaded.is_relative_to(source), 'Unexpected package path: {loaded}'"

      - name: Pytest
        run: python -m pytest

      - name: Validate production release gate
        env:
          APP_ENV: production
          DATABASE_URL: postgresql+asyncpg://gqmrmed:gqmrmed@db:5432/gqmrmed
          REDIS_URL: redis://redis:6379/0
          TELEGRAM_BOT_TOKEN: ci-token
          ADMIN_SECRET: ci-admin-secret-012345678901234567890123456789
          AI_PROVIDER_ORDER: openai
          AI_ALLOW_PAID: "true"
          AI_API_KEY: ci-ai-key
          AI_BASE_URL: https://api.openai.com/v1
          AI_MODEL: gpt-5.6-luna
          IMAGE_PROVIDER_ORDER: openai,procedural
          OPENAI_IMAGE_MODEL: gpt-image-2
        run: bash scripts/release-gate.sh

      - name: Validate production Compose contract
        run: |
          export DATABASE_URL='postgresql+asyncpg://gqmrmed:gqmrmed@db:5432/gqmrmed'
          export REDIS_URL='redis://redis:6379/0'
          export TELEGRAM_BOT_TOKEN='ci-token'
          export ADMIN_SECRET='ci-admin-secret-012345678901234567890123456789'
          export AI_PROVIDER_ORDER='openai'
          export AI_ALLOW_PAID='true'
          export AI_API_KEY='ci-ai-key'
          export AI_BASE_URL='https://api.openai.com/v1'
          export AI_MODEL='gpt-5.6-luna'
          export IMAGE_PROVIDER_ORDER='openai,procedural'
          export OPENAI_IMAGE_MODEL='gpt-image-2'
          docker compose -f compose.production.yml config --quiet

      - name: Build production container
        run: docker build --tag gqmrmed:ci .

      - name: Smoke-test production container imports
        run: |
          docker run --rm --entrypoint python gqmrmed:ci -c "import gqmrmed.main; import gqmrmed.services.runtime"
